<section class="match-scene__frame">
  <canvas id="match-3d-canvas" class="match-scene__canvas" aria-label="3D match scene"></canvas>

  <div class="match-scene__camera-panel" aria-label="玩家手勢鏡頭">
    <div class="match-scene__camera-title">人像</div>
    <div class="match-scene__camera-feed">
      <div class="match-scene__camera-feed-glow"></div>
    </div>
  </div>

  <div class="match-scene__ai-panel">
    <div class="match-scene__ai-avatar">ai</div>
    <div class="match-scene__ai-bubble">
      <span class="match-scene__ai-bubble-dots"></span>
      <span class="match-scene__ai-bubble-dots"></span>
      <span class="match-scene__ai-bubble-dots"></span>
    </div>
    <div class="match-scene__ai-label">ai說話</div>
  </div>

  <div class="match-scene__count-panel">
    <div class="match-scene__count-copy">取得<br>剩餘<br>披薩<br>數量</div>
    <div class="match-scene__count-number">3</div>
  </div>

  <div class="match-scene__status-banner">最後一個拿到 pizza 的人贏</div>

  <div class="match-scene__hud">
    <div class="match-scene__hud-row">
      <div class="match-scene__health match-scene__health--player">
        <span class="match-scene__label">玩家</span>
        <strong class="match-scene__value">3 / 3</strong>
      </div>

      <div class="match-scene__center-text">回合 1</div>

      <div class="match-scene__health match-scene__health--ai">
        <span class="match-scene__label">AI</span>
        <strong class="match-scene__value">3 / 3</strong>
      </div>
    </div>

    <div class="match-scene__actions">
      <button id="match-exit-btn" class="match-scene__exit-btn" type="button">退出</button>
    </div>
  </div>
</section>
