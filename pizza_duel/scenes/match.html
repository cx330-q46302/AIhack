<section class="match-scene__frame">
  <canvas id="match-3d-canvas" class="match-scene__canvas" aria-label="3D match scene"></canvas>

  <div class="match-scene__hud">
    <div class="match-scene__hud-row">
      <div class="match-scene__health match-scene__health--player">
        <span class="match-scene__label">玩家</span>
        <strong class="match-scene__value">3 / 3</strong>
      </div>

      <div class="match-scene__center-text">回合 1</div>

      <div class="match-scene__health match-scene__health--ai">
        <span class="match-scene__label">AI</span>
        <strong class="match-scene__value">3 / 3</strong>
      </div>
    </div>

    <div class="match-scene__actions">
      <button id="match-exit-btn" class="match-scene__exit-btn" type="button">退出</button>
    </div>
  </div>
</section>
